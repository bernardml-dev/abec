name: Monitor estoque ABECMED

on:
  schedule:
    # Roda a cada 5 minutos (GitHub pode atrasar um pouco em horários de pico)
    - cron: "* * * * *"
  workflow_dispatch: {} # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: write # necessário para o bot poder salvar o state.json de volta no repo

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rodar o monitor
        env:
          ABEC_CPF: ${{ secrets.ABEC_CPF }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node monitor.js

      - name: Salvar estado atualizado
        run: |
          git config --global user.name "abecmed-monitor-bot"
          git config --global user.email "actions@github.com"
          if ! git diff --quiet -- state.json; then
            git add state.json
            git commit -m "Atualiza estado do estoque [skip ci]"
            git push
          else
            echo "Nada mudou no state.json"
          fi
